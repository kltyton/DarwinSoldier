<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="aui-font-mode" content="mc">
  <meta name="aui-viewport" content="mode=browser,zoom=1,min-zoom=1,max-zoom=1,user-scalable=false">
  <meta name="aui-mouse-events" content="intercept">
  <title>Damage Adaptation Records</title>
  <link rel="stylesheet" href="/apricityui/theme/ore/ore.css">
  <link rel="stylesheet" href="../styles/darwin.css">
</head>
<body class="ore-theme darwin-screen">
  <header class="navbar darwin-header">
    <div class="navbar-brand"><translation>screen.darwin_soldier.adaptations.title</translation></div>
    <button class="button button-tertiary button-small" type="button" data-action="back"><translation>gui.done</translation></button>
  </header>
  <main class="container darwin-main">
    <section class="card card-accent-gold">
      <div class="card-header"><translation>screen.darwin_soldier.adaptations.title</translation></div>
      <div id="adaptation-list" class="card-body"></div>
    </section>
  </main>
  <footer class="darwin-footer split">
    <button id="adaptation-previous" class="button button-tertiary" type="button" data-action="previous-page"><translation>screen.darwin_soldier.aui.previous</translation></button>
    <span id="adaptation-page-summary" class="darwin-pagination-summary"></span>
    <button id="adaptation-next" class="button button-tertiary" type="button" data-action="next-page"><translation>screen.darwin_soldier.aui.next</translation></button>
