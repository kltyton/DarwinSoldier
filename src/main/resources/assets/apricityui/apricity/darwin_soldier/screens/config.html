<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="aui-font-mode" content="mc">
  <meta name="aui-viewport" content="mode=browser,zoom=1,min-zoom=1,max-zoom=1,user-scalable=false">
  <meta name="aui-mouse-events" content="intercept">
  <title>Darwin Soldier Configuration</title>
  <link rel="stylesheet" href="/apricityui/theme/ore/ore.css">
  <link rel="stylesheet" href="../styles/darwin.css">
</head>
<body class="ore-theme darwin-screen">
  <header class="navbar darwin-header">
    <div class="navbar-brand"><translation>config.darwin_soldier.title</translation></div>
    <button class="button button-tertiary button-small" type="button" data-action="cancel"><translation>gui.cancel</translation></button>
  </header>
  <main class="container darwin-main">
    <div id="config-error" class="alert alert-danger darwin-config-error hidden"></div>
    <div class="darwin-config-shell">
      <nav class="card darwin-config-nav">
        <div class="card-header"><translation>screen.darwin_soldier.aui.categories</translation></div>
        <div class="card-body p-2"><div id="config-categories" class="list-group"></div></div>
      </nav>
      <section class="card card-accent-green">
        <div id="config-category-title" class="card-header"></div>
        <div id="config-fields" class="card-body darwin-fields"></div>
      </section>
    </div>
  </main>
  <footer class="darwin-footer split">
    <button class="button button-danger" type="button" data-action="reset-category"><translation>screen.darwin_soldier.aui.reset_category</translation></button>
    <div class="cluster">
      <button class="button button-tertiary" type="button" data-action="cancel"><translation>gui.cancel</translation></button>
      <button class="button" type="button" data-action="save"><translation>gui.done</translation></button>
    </div>
  </footer>
</body>
</html>
