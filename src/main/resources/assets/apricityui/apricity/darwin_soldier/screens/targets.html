<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="aui-font-mode" content="mc">
  <meta name="aui-viewport" content="mode=browser,zoom=1,min-zoom=1,max-zoom=1,user-scalable=false">
  <meta name="aui-mouse-events" content="intercept">
  <title>Super Perception Targets</title>
  <link rel="stylesheet" href="/apricityui/theme/ore/ore.css">
  <link rel="stylesheet" href="../styles/darwin.css">
</head>
<body class="ore-theme darwin-screen">
  <header class="navbar darwin-header">
    <div class="navbar-brand"><translation>screen.darwin_soldier.targets.title</translation></div>
    <button class="button button-tertiary button-small" type="button" data-action="back"><translation>gui.done</translation></button>
  </header>
  <main class="container darwin-main">
    <section class="card card-accent-purple">
      <div class="card-header"><translation>screen.darwin_soldier.aui.target_filters</translation></div>
      <div id="target-filters" class="card-body cluster"></div>
    </section>
    <section class="card card-accent-green mt-3">
      <div class="card-header"><translation>screen.darwin_soldier.aui.entity_whitelist</translation></div>
      <div class="card-body">
        <div class="form-group darwin-search">
          <label class="form-label" for="target-search"><translation>screen.darwin_soldier.targets.search</translation></label>
          <input id="target-search" class="form-input" type="search" data-input="target-search">
          <div class="form-help"><translation>screen.darwin_soldier.targets.search_hint</translation></div>
        </div>
        <div id="target-list"></div>
      </div>
    </section>
  </main>
  <footer class="darwin-footer split">
    <button id="target-previous" class="button button-tertiary" type="button" data-action="previous-page"><translation>screen.darwin_soldier.aui.previous</translation></button>
    <span id="target-page-summary" class="darwin-pagination-summary"></span>
    <button id="target-next" class="button button-tertiary" type="button" data-action="next-page"><translation>screen.darwin_soldier.aui.next</translation></button>
  </footer>
</body>
</html>
